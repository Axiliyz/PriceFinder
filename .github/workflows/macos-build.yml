name: macOS .app build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: |
          pyinstaller --clean --windowed \
            --name "PriceFinder" \
            --hidden-import pandas_calamine \
            --hidden-import pandas.io.excel._base \
            --hidden-import pandas._libs.tslibs.timedeltas \
            --hidden-import pandas._libs.tslibs.nattype \
            --hidden-import pandas._libs.tslibs.timezones \
            app.py

      - name: Zip artifact
        run: |
          cd dist && zip -r PriceFinder-mac.zip "PriceFinder.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceFinder-mac
          path: dist/PriceFinder-mac.zip